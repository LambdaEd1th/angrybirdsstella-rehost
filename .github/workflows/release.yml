name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.98.1
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RUNTIME_DATA_RELEASE: runtime-data-v1.1.6
  RUNTIME_DATA_ARCHIVE: angry-birds-stella-runtime-data-v1.1.6-beta3.tar.gz
  RUNTIME_DATA_SHA256: 5192e225ccec77e604e76f9b8ce7b33fda067f67fefcff4239b22376e742e879

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-validate-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-validate-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run portable tests
        run: cargo test --locked -p stella-assets -p stella-core

      - name: Test external desktop resource selection
        run: cargo test --locked -p stella-app desktop_launch::tests

      - name: Test external release resources and packaging
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-14
            target: aarch64-apple-darwin
            package: unix
          - label: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: windows
          - label: Windows ARM64
            runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            package: windows
          - label: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: unix
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: unix
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - name: Install Rust target
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy
          rustup target add ${{ matrix.target }} --toolchain ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-

      - name: Check shipping launcher with strict Clippy
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'windows-msvc') && '-C target-feature=+crt-static' || '' }}
        run: cargo clippy -p stella-app --bin stella-app --release --all-features --locked --target ${{ matrix.target }} -- -D warnings

      - name: Build shipping game executable
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'windows-msvc') && '-C target-feature=+crt-static' || '' }}
        run: cargo build -p stella-app --bin stella-app --release --locked --target ${{ matrix.target }}

      - name: Package Unix release
        if: matrix.package == 'unix'
        shell: bash
        run: bash .github/scripts/package-unix.sh "${{ matrix.target }}" "$RELEASE_TAG"

      - name: Package Windows release
        if: matrix.package == 'windows'
        shell: pwsh
        run: .github/scripts/package-windows.ps1 -Target "${{ matrix.target }}" -Version "$env:RELEASE_TAG"

      - name: Upload packaged release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@v7

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Download and verify external runtime data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-data"
          gh release download "$RUNTIME_DATA_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$RUNTIME_DATA_ARCHIVE" \
            --dir "$RUNNER_TEMP/runtime-data"
          python3 .github/scripts/stage-runtime-data.py \
            "$RUNNER_TEMP/runtime-data/$RUNTIME_DATA_ARCHIVE" \
            --sha256 "$RUNTIME_DATA_SHA256" --output "$RUNNER_TEMP/runtime-data/data"

      - name: Add external resources to every platform archive
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zip unzip
          bash .github/scripts/add-runtime-data.sh dist "$RUNNER_TEMP/runtime-data/data"

      - name: Verify the five game archives and external resources
        shell: bash
        run: |
          python3 - "$RELEASE_TAG" <<'PYVERIFY'
          import hashlib
          import importlib.util
          import os
          from pathlib import Path
          import sys
          spec = importlib.util.spec_from_file_location("desktop_package", ".github/scripts/package-desktop.py")
          package = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(package)
          version = sys.argv[1]
          expected = {}
          for target in package.TARGETS:
              suffix = ".zip" if "windows" in target else ".tar.gz"
              name = f"angry-birds-stella-rehost-{version}-{target}{suffix}"
              expected[name] = target
          actual = {path.name for path in Path("dist").iterdir()}
          if actual != set(expected):
              raise SystemExit(f"unexpected release files: {actual ^ set(expected)}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary, open("dist/SHA256SUMS", "w") as checksums:
              summary.write("| Archive | SHA-256 |\n| --- | --- |\n")
              for name, target in expected.items():
                  path = Path("dist") / name
                  package.verify_package(path, target)
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  summary.write(f"| {name} | `{digest}` |\n")
                  checksums.write(f"{digest}  {name}\n")
          PYVERIFY

      - name: Create or update GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Preserve historical releases: do not silently retain a legacy
            # distribution format or delete previously published assets.
            gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
            python - "$RUNNER_TEMP/release-assets.json" <<'PYASSETS'
            import json
            from pathlib import Path
            import sys
            allowed = {path.name for path in Path("dist").iterdir()}
            existing = {asset["name"] for asset in json.loads(Path(sys.argv[1]).read_text())["assets"]}
            if existing - allowed:
                raise SystemExit("Existing release contains other assets; use a new version tag.")
            PYASSETS
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            release_options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_options+=(--prerelease)
            fi
            notes_file=".github/releases/$RELEASE_TAG.md"
            if [[ -f "$notes_file" ]]; then
              release_options+=(--notes-file "$notes_file")
            else
              release_options+=(--generate-notes)
            fi
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Angry Birds Stella: Rehost $RELEASE_TAG" \
              "${release_options[@]}"
          fi
          release_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
          if [[ "$release_draft" == "false" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  pages:
    name: Deploy release to GitHub Pages
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ format('refs/tags/{0}', github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}
